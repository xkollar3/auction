databaseChangeLog:
  - changeSet:
      id: 005-1-create-order-read-model-table
      author: system
      changes:
        - createTable:
            tableName: order_read_model
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: buyer_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: payment_intent_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: reserved_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: seller_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: seller_account_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: tracking_number
                  type: varchar(255)
              - column:
                  name: ship24_tracker_id
                  type: varchar(255)
              - column:
                  name: tracking_entered_at
                  type: timestamp with time zone
              - column:
                  name: tracking_status_milestone
                  type: varchar(50)
              - column:
                  name: tracking_event_status
                  type: varchar(255)
              - column:
                  name: tracking_last_updated_at
                  type: timestamp with time zone
              - column:
                  name: completed_at
                  type: timestamp with time zone
              - column:
                  name: cancelled_at
                  type: timestamp with time zone
              - column:
                  name: refund_id
                  type: varchar(255)
        - createIndex:
            tableName: order_read_model
            indexName: idx_order_read_model_buyer_id
            columns:
              - column:
                  name: buyer_id
        - createIndex:
            tableName: order_read_model
            indexName: idx_order_read_model_seller_id
            columns:
              - column:
                  name: seller_id
        - createIndex:
            tableName: order_read_model
            indexName: idx_order_read_model_status
            columns:
              - column:
                  name: status
  - changeSet:
      id: 005-2-create-order-user-id-lookup-table
      author: system
      changes:
        - createTable:
            tableName: order_user_id_lookup_table
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: keycloak_user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
